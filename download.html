<!--
  Device redirect. No cookies, no storage, no analytics. The only third-party request is the
  homepage's Google Fonts stylesheet above.
  storeUrlFor() is a pure function (exposed on window for testing): it returns the right
  store URL for iOS / Android, or null for desktop/unknown (which just shows both badges).
  Mirrors the app's own deviceFrom() rule, including the iPadOS desktop-UA case.
-->
<script>
  (function () {
    var APP_STORE = "https://apps.apple.com/gb/app/schoolsphere-parent-planner/id6761808005";
    var GOOGLE_PLAY = "https://play.google.com/store/apps/details?id=app.schoolsphere.android";
    function storeUrlFor(ua, maxTouchPoints) {
      ua = String(ua || "");
      if (/android/i.test(ua)) return GOOGLE_PLAY;
      if (/iphone|ipad|ipod/i.test(ua)) return APP_STORE;
      // iPadOS 13+ presents a desktop "Macintosh" UA; a touch Mac is an iPad.
      if (/macintosh/i.test(ua) && (maxTouchPoints || 0) > 1) return APP_STORE;
      return null; // desktop / anything we can't tell → show both badges
    }
    window.__storeUrlFor = storeUrlFor; // for tests only
    try {
      var target = storeUrlFor(navigator.userAgent, navigator.maxTouchPoints);
      if (target) window.location.replace(target);
    } catch (e) { /* leave the page showing both badges */ }
  })();
</script>
<style>

  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(1.9rem, 6vw, 2.5rem); line-height: 1.12; letter-spacing: -0.5px; margin-bottom: 14px; }
  h1 em { font-style: italic; color: var(--sage); }
  p.lede { font-size: 1.04rem; color: var(--muted); max-width: 360px; margin: 0 auto 30px; line-height: 1.55; }
  .badges { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; }
  .badge { display: inline-block; line-height: 0; border-radius: 9px; transition: transform .15s; }
  .badge:hover { transform: translateY(-2px); }
  .badge img { height: 50px; width: auto; display: block; }
  .badge-play img { height: 74px; margin: -12px; } /* Google's PNG has built-in clear space; line the two up */
  .foot { margin-top: 30px; font-size: 0.86rem; color: rgba(242,240,235,0.45); }
  .foot a { color: rgba(242,240,235,0.6); text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .badge { transition: none; } }
